server:
  port: 8081

spring:
  application:
    name: fitness-member-service

  datasource:
    url: jdbc:mysql://localhost:3306/fitness_project?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 010409
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  cloud:
    gateway:
      routes:
        - id: member-service
          uri: http://localhost:8082
          predicates:
            - Path=/members/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/payments/**

        - id: plan-service
          uri: http://localhost:8084
          predicates:
            - Path=/plans/**

        - id: trainer-service
          uri: http://localhost:8085
          predicates:
            - Path=/trainers/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

#    register-with-eureka: true
#    fetch-registry: true