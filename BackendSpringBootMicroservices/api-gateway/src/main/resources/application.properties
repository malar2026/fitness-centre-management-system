spring.application.name=api-gateway
server.port=8080

# Eureka Client config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Enable service discovery in gateway
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ❌ Disable auto routing
spring.cloud.gateway.discovery.locator.enabled=false

# =========================
# ✅ MEMBER SERVICE ROUTE
# =========================
spring.cloud.gateway.routes[0].id=fitness-member-service
spring.cloud.gateway.routes[0].uri=lb://fitness-member-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/members/**

# =========================
# ✅ PAYMENT SERVICE ROUTE
# =========================
spring.cloud.gateway.routes[1].id=fitness-payment-service
spring.cloud.gateway.routes[1].uri=lb://fitness-payment-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/payments/**


# =========================
# ✅ PLAN SERVICE ROUTE
# =========================
spring.cloud.gateway.routes[2].id=fitness-plan-service
spring.cloud.gateway.routes[2].uri=lb://fitness-plan-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/plans/**


# =========================
# TRAINER SERVICE
# =========================
spring.cloud.gateway.routes[3].id=fitness-trainer-service
spring.cloud.gateway.routes[3].uri=lb://fitness-trainer-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/trainers/**


spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

            
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

